<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Desktop App</title>
<script src="https://www.google.com/search?q=https://cdn.tailwindcss.com"></script>
<link href="https://www.google.com/search?q=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://www.google.com/search?q=https://fonts.googleapis.com/css2%3Ffamily%3DInter:wght%40300%3B400%3B500%3B600%3B700%26display%3Dswap');

    :root {
        --primary: #2563eb;
        --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }

    body { 
        font-family: 'Inter', sans-serif; 
        background: var(--bg-gradient);
        min-height: 100vh;
    }

    .glass-panel {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .loading-spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media print {
        .no-print { display: none !important; }
        body { background: white; }
        .glass-panel { border: none; box-shadow: none; }
    }
</style>


</head>
<body class="p-4 md:p-10">
<div class="max-w-5xl mx-auto">
<header class="flex flex-col md:flex-row justify-between items-center mb-10 no-print">
<div class="mb-4 md:mb-0">
<h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">
<i class="fas fa-graduation-cap text-blue-600 mr-2"></i>EduGen AI
</h1>
<p class="text-slate-500 mt-1">Hệ thống tạo bài tập phân hóa & phản hồi thông minh</p>
</div>
<div class="flex gap-2">
<button onclick="window.print()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
<i class="fas fa-print"></i> In bài tập
</button>
</div>
</header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-4 space-y-6 no-print">
            <div class="glass-panel rounded-2xl shadow-xl p-6 border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-blue-500"></i> Cấu hình bài tập
                </h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Chủ đề bài học</label>
                        <input id="topic" type="text" placeholder="Ví dụ: Đạo hàm lớp 11" 
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Đối tượng (Lớp)</label>
                        <input id="grade" type="text" placeholder="Lớp 10A1..." 
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Mức độ phân hóa</label>
                        <select id="level" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition bg-slate-50 cursor-pointer">
                            <option value="differentiated">Phân hóa (Dễ -> Khó)</option>
                            <option value="easy">Cơ bản (Nhận biết)</option>
                            <option value="medium">Khá (Thông hiểu)</option>
                            <option value="hard">Giỏi (Vận dụng cao)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Số câu hỏi</label>
                        <input id="count" type="range" min="1" max="15" value="5" oninput="this.nextElementSibling.value = this.value"
                               class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        <output class="block text-center font-bold text-blue-600 mt-1">5</output>
                    </div>

                    <button id="generateBtn" onclick="generateContent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-3">
                        <i class="fas fa-bolt"></i> TẠO BÀI TẬP
                    </button>
                </div>
            </div>
        </aside>

        <main class="lg:col-span-8">
            <div id="welcomeScreen" class="glass-panel rounded-2xl shadow-xl p-12 text-center border border-slate-200 no-print">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-file-invoice text-3xl text-blue-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Sẵn sàng tạo bài tập?</h2>
                <p class="text-slate-500">Nhập thông tin bên trái để AI bắt đầu thiết kế bộ câu hỏi.</p>
            </div>

            <div id="resultContainer" class="hidden space-y-6">
                <div class="glass-panel rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 border-b border-slate-200 px-6 py-3 flex justify-between items-center no-print">
                        <span class="text-sm font-semibold text-slate-600 uppercase tracking-wider">Nội dung bài tập</span>
                        <button onclick="copyToClipboard()" class="text-slate-600 hover:text-blue-600 transition flex items-center gap-1 text-sm font-medium">
                            <i class="fas fa-copy"></i> Sao chép
                        </button>
                    </div>
                    <div id="contentArea" class="p-8 md:p-12 prose max-w-none text-slate-800 leading-relaxed min-h-[500px]">
                        <div id="loading" class="flex flex-col items-center justify-center py-20">
                            <div class="loading-spinner mb-4 w-12 h-12"></div>
                            <p class="text-slate-500 font-medium animate-pulse">Đang soạn thảo bài tập...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="feedbackToast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3">
    <i class="fas fa-check-circle text-green-400"></i>
    <span>Đã sao chép vào bộ nhớ tạm!</span>
</div>

<script>
    const apiKey = ""; 

    async function generateContent() {
        const topic = document.getElementById('topic').value;
        const grade = document.getElementById('grade').value;
        const level = document.getElementById('level').value;
        const count = document.getElementById('count').value;
        
        const welcomeScreen = document.getElementById('welcomeScreen');
        const resultContainer = document.getElementById('resultContainer');
        const loading = document.getElementById('loading');
        const contentArea = document.getElementById('contentArea');
        const btn = document.getElementById('generateBtn');

        if (!topic) return;

        welcomeScreen.classList.add('hidden');
        resultContainer.classList.remove('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        const systemPrompt = `Bạn là trợ lý giáo dục. Tạo bộ bài tập phân hóa (Nhận biết, Thông hiểu, Vận dụng). Cuối cùng phải có đáp án và giải thích chi tiết. Dùng thẻ HTML (h2, h3, p, strong, ul, li).`;
        const userPrompt = `Soạn bài tập: "${topic}" cho ${grade}, số câu: ${count}, mức độ: ${level}.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                })
            });

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
                loading.classList.add('hidden');
                contentArea.innerHTML = text.replace(/```html/g, '').replace(/```/g, '');
            }
        } catch (error) {
            contentArea.innerHTML = "Lỗi kết nối AI.";
        } finally {
            btn.disabled = false;
        }
    }

    function copyToClipboard() {
        const content = document.getElementById('contentArea').innerText;
        const el = document.createElement('textarea');
        el.value = content;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        const toast = document.getElementById('feedbackToast');
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }
</script>


</body>
</html>
