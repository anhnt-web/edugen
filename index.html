<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGen AI - Trình Tạo Bài Tập Thông Minh</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-bottom: 4px solid var(--primary);
        }

        .header h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
        .header p { margin: 5px 0 0; color: #64748b; }

        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: var(--primary-dark); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .result-panel {
            background: white;
            border-radius: 15px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .result-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            padding: 25px;
            line-height: 1.8;
            font-size: 1.05rem;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .copy-btn {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>EduGen AI - Trợ Lý Giáo Viên</h1>
            <p>Tạo bộ câu hỏi, bài tập phân hóa và đáp án chi tiết tự động</p>
        </div>

        <div class="main-layout">
            <div class="card">
                <div class="input-group">
                    <label>Chủ đề bài học</label>
                    <input id="topic" type="text" placeholder="Ví dụ: Quang hợp, Đạo hàm...">
                </div>
                <div class="input-group">
                    <label>Đối tượng học sinh</label>
                    <input id="grade" type="text" placeholder="Ví dụ: Lớp 10, Sinh viên...">
                </div>
                <div class="input-group">
                    <label>Mức độ yêu cầu</label>
                    <select id="level">
                        <option value="Phân hóa 3 mức độ (Dễ, Trung bình, Khó)">Đầy đủ (Dễ - TB - Khó)</option>
                        <option value="Nhận biết cơ bản">Dễ (Nhận biết)</option>
                        <option value="Thông hiểu ứng dụng">Khá (Thông hiểu)</option>
                        <option value="Vận dụng cao">Giỏi (Vận dụng nâng cao)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Số lượng câu hỏi: <span id="num">5</span></label>
                    <input id="count" type="range" min="1" max="15" value="5" style="width:100%" oninput="document.getElementById('num').innerText = this.value">
                </div>
                <button id="btn" onclick="runAI()" class="btn">TẠO BÀI TẬP NGAY</button>
            </div>

            <div class="result-panel">
                <div class="result-header">
                    <span style="font-weight: bold; color: var(--primary);">KẾT QUẢ SOẠN THẢO</span>
                    <button class="copy-btn" onclick="copy()">Sao chép</button>
                </div>
                <div id="output" class="content">
                    <div style="text-align: center; color: #94a3b8; margin-top: 100px;">
                        Nhập thông tin bên trái và nhấn nút để bắt đầu tạo nội dung.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tôi đã điền mã API của bạn vào đây
        const KEY = "AIzaSyBqmDlvpCBn85jE3LZIUxbfKajH19plC3M"; 

        async function runAI() {
            const topic = document.getElementById('topic').value;
            const grade = document.getElementById('grade').value;
            const level = document.getElementById('level').value;
            const count = document.getElementById('count').value;
            const out = document.getElementById('output');
            const btn = document.getElementById('btn');

            if(!topic || !grade) {
                alert("Bạn cần nhập Chủ đề và Đối tượng học sinh!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Đang soạn thảo...';
            out.innerHTML = '<div style="text-align:center; margin-top:100px;">AI đang thiết kế bài tập và đáp án giải thích... Vui lòng đợi trong giây lát.</div>';

            const prompt = `Bạn là một giáo viên chuyên nghiệp bậc ${grade}. Hãy soạn ${count} câu hỏi bài tập về chủ đề "${topic}".
            Yêu cầu:
            1. Phân hóa: ${level}.
            2. Trình bày trắc nghiệm có A, B, C, D rõ ràng.
            3. PHẦN QUAN TRỌNG NHẤT: Cuối bài phải có ĐÁP ÁN VÀ GIẢI THÍCH CHI TIẾT (Phản hồi sư phạm) cho từng câu.
            Trả lời hoàn toàn bằng tiếng Việt, định dạng chuyên nghiệp.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const result = data.candidates[0].content.parts[0].text;
                out.innerHTML = result.replace(/\*\*/g, "").replace(/###/g, "");

            } catch (e) {
                out.innerHTML = `<div style="color:red; padding:20px; text-align:center;">
                    <strong>Lỗi:</strong> ${e.message}<br><br>
                    Mẹo: Hãy đảm bảo máy tính của bạn có kết nối mạng ổn định.
                </div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "TẠO BÀI TẬP NGAY";
            }
        }

        function copy() {
            const text = document.getElementById('output').innerText;
            if(!text || text.includes("Nhập thông tin")) return;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Đã sao chép thành công!");
        }
    </script>
</body>
</html>
